services:
  gps-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: gps-simulator:local
    container_name: gps-simulator
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
    userns_mode: keep-id
    command: ["--mode", "software"]

  gps-simulator-hardware:
    profiles: ["hardware"]
    build:
      context: .
      dockerfile: Dockerfile
    image: gps-simulator:local
    container_name: gps-simulator-hardware
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - /dev:/dev          # <-- монтуємо весь /dev
    environment:
      PYTHONUNBUFFERED: "1"
    userns_mode: keep-id
    device_cgroup_rules:
      - "c 189:* rwm"      # USB-шина (HackRF)
      - "c 166:* rwm"      # ttyACM* (ZED-F9P)
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    #   - /dev/ttyACM0:/dev/ttyACM0
    command: ["--mode", "hardware"]

  gps-simulator-hardware-debug:
    profiles: ["hardware"]
    build:
      context: .
      dockerfile: Dockerfile
    image: gps-simulator:local
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - /dev:/dev
    environment:
      PYTHONUNBUFFERED: "1"
    userns_mode: keep-id
    entrypoint: ["bash"]
    # command не задан — bash запустится интерактивно
    